name: 'OpenTofu Destroy'

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}

jobs:
  tofu-destroy:
    name: 'Tofu Destroy'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        continue-on-error: true
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Delete Ingress and LoadBalancers to clean up GCP resources
        continue-on-error: true
        run: |
          kubectl delete ingress --all --all-namespaces || true
          kubectl delete svc -n ingress-nginx --all || true
          echo "Esperando 120s para que Google Cloud elimine los Load Balancers y firewalls..."
          sleep 120

      - name: Tofu Init
        working-directory: ./Entrega3/terraform
        run: tofu init -upgrade

      - name: Tofu Destroy
        working-directory: ./Entrega3/terraform
        run: |
          tofu destroy -auto-approve \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="cluster_name=${{ env.CLUSTER_NAME }}"

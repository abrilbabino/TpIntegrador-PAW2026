apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pawmap-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pawmap.lat
      secretName: pawmap-tls
  rules:
    - host: pawmap.lat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pawmap-service
                port:
                  number: 80